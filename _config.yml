# =========================
# Site Settings
# =========================
title: Saif Way Technology
tagline: Network Infrastructure & Python Automation by Imran Sarwar
description: >
  Imran Sarwar combines network infrastructure and NOC/data center operations
  experience with Python network automation, multi-vendor Netmiko workflows,
  Flask applications and REST API integration. Explore projects and engineering support.
  
url: "https://saifwaytech.com"
baseurl: ""
inquiry_email: "m.imransaif786@gmail.com"

# =========================
# Author / Brand Identity
# =========================
author:
  name: Imran Sarwar
  email: contact@saifwaytech.com
  linkedin: imransarwaritpro
  github: Imran5693

# =========================
# Plugins
# =========================
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# =========================
# Markdown / Theme
# =========================
markdown: kramdown
theme: null

# =========================
# Exclusions
# =========================
exclude:
  - _editorial
  - blog-review.html
  - blog-keyword-audit.html
  - AGENTS.md
  - assets/images/blog/netmiko-readtimeout-troubleshooting.prompt.txt
  - BLOG-KEYWORD-OPPORTUNITIES-2026-10-19.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - SEO-AUDIT.md
  - SEO-POSITIONING.md
  - SEO-INTERNATIONAL-RESEARCH.md
  - EMAIL-DELIVERY.md
  - BLOG-SEO-REVIEW.md
  - .jekyll-cache
  - .sass-cache
  - .git
  - .agents

# =========================
# Sitemap Controls (IMPORTANT)
# =========================
defaults:
  # Blog posts
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Imran Sarwar"
      sitemap: true
      priority: 0.8
      changefreq: monthly

  # Projects (HIGHEST SEO VALUE)
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
      sitemap: true
      priority: 0.9
      changefreq: monthly

  # Assets (exclude PDFs & images from sitemap)
  - scope:
      path: "assets"
    values:
      sitemap: false

# =========================
# Collections
# =========================
collections:
  projects:
    output: true
    permalink: /projects/:name/

# =========================
# Jekyll SEO Tag Settings
# =========================
social:
  name: Imran Sarwar
  links:
    - https://www.linkedin.com/in/imransarwaritpro/
    - https://github.com/Imran5693
    - https://www.youtube.com/@SaifWayTech
    - https://www.facebook.com/profile.php?id=61563409706801
