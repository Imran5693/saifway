<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Return-path bypass: prove both directions</title><desc id="desc">Hypothetical no-NAT client/server path around a stateful firewall.</desc>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<text x="40" y="50" font-family="Arial,sans-serif" font-size="26" fill="#17324d">Client 198.51.100.20 → server 192.0.2.20:443</text>
<rect x="60" y="110" width="290" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">Client network</text>
<text x="73" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">198.51.100.0/24</text>
<rect x="405" y="110" width="290" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="418" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">PAN-OS firewall</text>
<text x="418" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">Server LAN: 192.0.2.1</text>
<rect x="750" y="110" width="290" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="763" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">Linux server</text>
<text x="763" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.20/24</text>
<path d="M350,160 L405,160" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M695,160 L750,160" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="310" width="980" height="120" rx="12" fill="#fff3df" stroke="#d0dce6"/>
<text x="80" y="349" font-family="Arial,sans-serif" font-size="24" fill="#17324d">BEFORE: server reply → 192.0.2.254 → alternate bypass</text>
<text x="80" y="389" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Firewall sees forward flow; no matching reverse packet arrives.</text>
<rect x="60" y="490" width="980" height="135" rx="12" fill="#e0f5f1" stroke="#d0dce6"/>
<text x="80" y="529" font-family="Arial,sans-serif" font-size="23" fill="#17324d">AFTER: server client-subnet route → 192.0.2.1 → firewall</text>
<text x="80" y="570" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Add 198.51.100.0/24 via .1; default via .254 stays intact.</text>
<text x="40" y="690" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Verify a new tuple, both directional observations and application delivery.</text>
<text x="40" y="735" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Proposed standalone classic virtual-router lab; no observed traffic claimed.</text>
</svg>
