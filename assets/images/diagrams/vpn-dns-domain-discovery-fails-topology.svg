<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">VPN discovery: resolver selection and service path</title><desc id="desc">Hypothetical pilot missing a private namespace rule; tunnel routes already exist.</desc>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<text x="40" y="50" font-family="Arial,sans-serif" font-size="28" fill="#17324d">Windows VPN client • corp.example.test</text>
<rect x="60" y="110" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">Private SRV discovery</text>
<text x="73" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">Default client DNS path</text>
<rect x="630" y="110" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="643" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">Approved AD resolver</text>
<text x="643" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.53</text>
<path d="M470,160 L630,160" stroke="#bf6a0c" stroke-width="4"/>
<path d="M542.0,148.0 L558.0,172.0 M558.0,148.0 L542.0,172.0" stroke="#bf6a0c" stroke-width="4"/>
<text x="60" y="265" font-family="Arial,sans-serif" font-size="23" fill="#17324d">BEFORE: explicit AD DNS answers; default-path query fails.</text>
<rect x="60" y="330" width="980" height="125" rx="12" fill="#e0f5f1" stroke="#d0dce6"/>
<text x="80" y="367" font-family="Arial,sans-serif" font-size="23" fill="#17324d">AFTER: pilot suffix .corp.example.test → DNS 192.0.2.53</text>
<text x="80" y="409" font-family="Arial,sans-serif" font-size="22" fill="#17324d">NRPT changes resolver selection only; tunnel routing is separate.</text>
<rect x="60" y="525" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="555" font-family="Arial,sans-serif" font-size="21" fill="white">Returned controller</text>
<text x="73" y="584" font-family="Arial,sans-serif" font-size="21" fill="white">dc01.corp.example.test</text>
<rect x="630" y="525" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="643" y="555" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.10</text>
<text x="643" y="584" font-family="Arial,sans-serif" font-size="21" fill="white">Verify tunnel + AD services</text>
<path d="M470,575 L630,575" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<text x="40" y="735" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Proposed standalone pilot. Managed clients need their authoritative VPN policy.</text>
</svg>
