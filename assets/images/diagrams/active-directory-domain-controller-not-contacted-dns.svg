<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Active Directory Domain Controller Could Not Be Contacted: DNS Checks</title><desc id="desc">Hypothetical lab before and after correction; not production evidence.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<text x="40" y="48" fill="#17324d" font-family="Arial,sans-serif" font-size="20">SAIF WAY TECH · HYPOTHETICAL LAB</text>
<rect x="25" y="90" width="1050" height="290" rx="14" fill="white" stroke="#d0dce6"/>
<text x="45" y="130" fill="#17324d" font-family="Arial,sans-serif" font-size="27">BEFORE · resolver cannot answer the AD zone</text>
<rect x="50" y="165" width="300" height="95" rx="10" fill="#17324d"/>
<text x="65" y="200" fill="#ffffff" font-family="Arial,sans-serif" font-size="23">Windows client</text>
<text x="65" y="235" fill="#d7f8f4" font-family="Arial,sans-serif" font-size="20">192.0.2.20/24</text>
<path d="M350,210 L395,210" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="400" y="165" width="300" height="95" rx="10" fill="#17324d"/>
<text x="415" y="200" fill="#ffffff" font-family="Arial,sans-serif" font-size="23">Wrong resolver</text>
<text x="415" y="235" fill="#d7f8f4" font-family="Arial,sans-serif" font-size="20">No AD zone/forwarding</text>
<path d="M700,210 L740,210 M717,198 L732,222 M732,198 L717,222" stroke="#bf6a0c" stroke-width="4"/>
<rect x="750" y="165" width="300" height="95" rx="10" fill="#17324d"/>
<text x="765" y="200" fill="#ffffff" font-family="Arial,sans-serif" font-size="23">DC/DNS server</text>
<text x="765" y="235" fill="#d7f8f4" font-family="Arial,sans-serif" font-size="20">192.0.2.53/24</text>
<text x="45" y="295" fill="#17324d" font-family="Arial,sans-serif" font-size="22">Query: _ldap._tcp.dc._msdcs.ad.example.test → discovery fails.</text>
<text x="45" y="340" fill="#17324d" font-family="Arial,sans-serif" font-size="21">Internet DNS may work; that does not establish AD service discovery.</text>
<rect x="25" y="400" width="1050" height="290" rx="14" fill="white" stroke="#d0dce6"/>
<text x="45" y="440" fill="#17324d" font-family="Arial,sans-serif" font-size="27">AFTER · client uses approved AD-aware DNS</text>
<rect x="50" y="475" width="300" height="95" rx="10" fill="#17324d"/>
<text x="65" y="510" fill="#ffffff" font-family="Arial,sans-serif" font-size="23">Windows client</text>
<text x="65" y="545" fill="#d7f8f4" font-family="Arial,sans-serif" font-size="20">DNS: 192.0.2.53</text>
<path d="M350,520 L395,520" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="400" y="475" width="300" height="95" rx="10" fill="#17324d"/>
<text x="415" y="510" fill="#ffffff" font-family="Arial,sans-serif" font-size="23">AD DNS query</text>
<text x="415" y="545" fill="#d7f8f4" font-family="Arial,sans-serif" font-size="20">SRV target + A record</text>
<path d="M700,520 L745,520" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="750" y="475" width="300" height="95" rx="10" fill="#17324d"/>
<text x="765" y="510" fill="#ffffff" font-family="Arial,sans-serif" font-size="23">dc1.ad.example.test</text>
<text x="765" y="545" fill="#d7f8f4" font-family="Arial,sans-serif" font-size="20">Separate service checks</text>
<text x="45" y="605" fill="#17324d" font-family="Arial,sans-serif" font-size="22">SRV returns LDAP port 389; controller A record returns 192.0.2.53.</text>
<text x="45" y="650" fill="#17324d" font-family="Arial,sans-serif" font-size="21">Verify default resolver + DC Locator; DNS success is not full join success.</text>
<text x="40" y="735" fill="#17324d" font-family="Arial,sans-serif" font-size="19">Read the article for prerequisites, controlled changes and verification limits.</text>
</svg>
