<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">IKEv2 SAML: locate the first failure</title><desc id="desc">Hypothetical diagnostic decisions with Yes continuation and No evidence branches.</desc>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<text x="40" y="48" font-family="Arial,sans-serif" font-size="25" fill="#17324d">IKEv2 SAML: locate the first failure</text>
<rect x="60" y="95" width="460" height="95" rx="12" fill="#17324d" stroke="#17324d"/>
<rect x="590" y="95" width="460" height="95" rx="12" fill="white" stroke="#bf6a0c"/>
<text x="80" y="150" font-family="Arial,sans-serif" font-size="23" fill="white">Approved SAML endpoint reached?</text>
<path d="M520,143 L590,143" stroke="#168c87" stroke-width="4"/>
<text x="610" y="119" font-family="Arial,sans-serif" font-size="20" fill="#bf6a0c">No →</text>
<text x="610" y="141" font-family="Arial,sans-serif" font-size="20" fill="#17324d">Check profile port, path and TLS</text>
<text x="610" y="163" font-family="Arial,sans-serif" font-size="20" fill="#17324d">trust.</text>
<path d="M290,190 L290,250" stroke="#168c87" stroke-width="4"/>
<text x="310" y="230" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Yes ↓</text>
<rect x="60" y="270" width="460" height="95" rx="12" fill="#17324d" stroke="#17324d"/>
<rect x="590" y="270" width="460" height="95" rx="12" fill="white" stroke="#bf6a0c"/>
<text x="80" y="325" font-family="Arial,sans-serif" font-size="23" fill="white">SP accepts authorized identity?</text>
<path d="M520,318 L590,318" stroke="#168c87" stroke-width="4"/>
<text x="610" y="294" font-family="Arial,sans-serif" font-size="20" fill="#bf6a0c">No →</text>
<text x="610" y="316" font-family="Arial,sans-serif" font-size="20" fill="#17324d">Correlate IdP, claims, group and</text>
<text x="610" y="338" font-family="Arial,sans-serif" font-size="20" fill="#17324d">time.</text>
<path d="M290,365 L290,425" stroke="#168c87" stroke-width="4"/>
<text x="310" y="405" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Yes ↓</text>
<rect x="60" y="445" width="460" height="95" rx="12" fill="#17324d" stroke="#17324d"/>
<rect x="590" y="445" width="460" height="95" rx="12" fill="white" stroke="#bf6a0c"/>
<text x="80" y="500" font-family="Arial,sans-serif" font-size="23" fill="white">IKE and child SA established?</text>
<path d="M520,493 L590,493" stroke="#168c87" stroke-width="4"/>
<text x="610" y="469" font-family="Arial,sans-serif" font-size="20" fill="#bf6a0c">No →</text>
<text x="610" y="491" font-family="Arial,sans-serif" font-size="20" fill="#17324d">Inspect peer auth, EAP and</text>
<text x="610" y="513" font-family="Arial,sans-serif" font-size="20" fill="#17324d">allocation.</text>
<path d="M290,540 L290,600" stroke="#168c87" stroke-width="4"/>
<text x="310" y="580" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Yes ↓</text>
<rect x="60" y="620" width="990" height="80" rx="12" fill="#e0f5f1" stroke="#e0f5f1"/>
<text x="80" y="651" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Verify assigned address, routes, policy, counters and application return path.</text>
<text x="40" y="738" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Browser sign-in success does not prove VPN establishment or data access.</text>
</svg>
