<text x="73" y="340" font-family="Arial,sans-serif" font-size="21" fill="white">app01</text>
<text x="73" y="369" font-family="Arial,sans-serif" font-size="21" fill="white">Domain member</text>
<rect x="405" y="310" width="290" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="418" y="340" font-family="Arial,sans-serif" font-size="20" fill="white">Eligible DC</text>
