<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Windows Time: restore member hierarchy</title><desc id="desc">Hypothetical locally configured member uses an unreachable manual source.</desc>
