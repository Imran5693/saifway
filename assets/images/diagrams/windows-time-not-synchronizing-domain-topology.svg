<path d="M695,360 L750,360" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="470" width="980" height="155" rx="12" fill="#e0f5f1" stroke="#d0dce6"/>
<text x="80" y="507" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Arrows follow source dependency; actual DC selection is dynamic.</text>
<text x="80" y="545" font-family="Arial,sans-serif" font-size="23" fill="#17324d">W32Time: UDP source 123 → destination 123</text>
<text x="80" y="583" font-family="Arial,sans-serif" font-size="23" fill="#17324d">stripchart: ephemeral UDP source → destination 123</text>
<text x="40" y="690" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Member repair only. Review PDC, hypervisor and policy ownership separately.</text>
