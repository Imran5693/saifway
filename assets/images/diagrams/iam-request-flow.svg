<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Flask and Keystone Request Flow</title>
<desc id="desc">Keep presentation, authorization and service outcomes distinct. Administrator request: Display the target project, identity and intended action.. Flask application checks: Validate input, session and permission for the operation.. Keystone policy and scope: Evaluate the request using the service configuration.. Result and audit context: Show the outcome; record actor and target without secrets.</desc>
