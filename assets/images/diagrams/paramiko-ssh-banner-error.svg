<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Locate the SSH handshake failure</title><desc id="desc">Confirm the destination: Verify hostname, port, route and management network.. Observe the SSH greeting: Compare a manual SSH attempt with the automation failure.. Check service and resource limits: Inspect server logs, session limits and concurrent client activity.. Retest with bounded timeouts: Record timing and versions; do not confuse login with command execution.. Conceptual workflow, not measured lab results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5eead4"/></marker></defs><rect width="1100" height="760" rx="26" fill="#101c30"/><g font-family="Arial, Helvetica, sans-serif"><text x="54" y="53" fill="#5eead4" font-size="19" letter-spacing="2">SAIF WAY TECHNOLOGY · DIAGNOSTIC WORKFLOW</text><text x="54" y="105" fill="white" font-size="34" font-weight="700">Locate the SSH handshake failure</text><rect x="54" y="142" width="992" height="110" rx="17" fill="#1d3049" stroke="#365472"/><circle cx="94" cy="178" r="20" fill="#5eead4"/><text x="94" y="185" text-anchor="middle" fill="#101c30" font-size="21" font-weight="700">1</text><text x="130" y="186" fill="white" font-size="27" font-weight="700">Confirm the destination</text><text x="80" y="222" fill="#cbd5e1" font-size="22">Verify hostname, port, route and management network.</text><path d="M550 254V270" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="54" y="275" width="992" height="110" rx="17" fill="#1d3049" stroke="#365472"/><circle cx="94" cy="311" r="20" fill="#5eead4"/><text x="94" y="318" text-anchor="middle" fill="#101c30" font-size="21" font-weight="700">2</text><text x="130" y="319" fill="white" font-size="27" font-weight="700">Observe the SSH greeting</text><text x="80" y="355" fill="#cbd5e1" font-size="22">Compare a manual SSH attempt with the automation failure.</text><path d="M550 387V403" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="54" y="408" width="992" height="110" rx="17" fill="#1d3049" stroke="#365472"/><circle cx="94" cy="444" r="20" fill="#5eead4"/><text x="94" y="451" text-anchor="middle" fill="#101c30" font-size="21" font-weight="700">3</text><text x="130" y="452" fill="white" font-size="27" font-weight="700">Check service and resource limits</text><text x="80" y="488" fill="#cbd5e1" font-size="22">Inspect server logs, session limits and concurrent client activity.</text><path d="M550 520V536" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="54" y="541" width="992" height="110" rx="17" fill="#1d3049" stroke="#365472"/><circle cx="94" cy="577" r="20" fill="#5eead4"/><text x="94" y="584" text-anchor="middle" fill="#101c30" font-size="21" font-weight="700">4</text><text x="130" y="585" fill="white" font-size="27" font-weight="700">Retest with bounded timeouts</text><text x="80" y="621" fill="#cbd5e1" font-size="22">Record timing and versions; do not confuse login with command execution.</text><text x="54" y="714" fill="#fbbf24" font-size="21">Proposed diagnostic sequence · validate against your platform and software release.</text></g></svg>