<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">DHCP capacity: expand only approved addresses</title><desc id="desc">Hypothetical standalone /24 scope gains 20 approved pool addresses.</desc>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<text x="40" y="50" font-family="Arial,sans-serif" font-size="28" fill="#17324d">VLAN 42 • scope 192.0.2.0/24</text>
<rect x="60" y="100" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="130" font-family="Arial,sans-serif" font-size="21" fill="white">Clients → relay/gateway</text>
<text x="73" y="159" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.1</text>
<rect x="630" y="100" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="643" y="130" font-family="Arial,sans-serif" font-size="21" fill="white">dhcp01.example.test</text>
<text x="643" y="159" font-family="Arial,sans-serif" font-size="21" fill="white">198.51.100.10</text>
<path d="M470,150 L630,150" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<text x="395" y="245" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Relay path verified</text>
<rect x="60" y="300" width="980" height="125" rx="12" fill="#fff3df" stroke="#d0dce6"/>
<text x="80" y="335" font-family="Arial,sans-serif" font-size="25" fill="#17324d">BEFORE: pool 192.0.2.100–149 • 50 addresses</text>
<text x="80" y="374" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Lab assumes all 50 valid leases; no policies or exclusions.</text>
<rect x="60" y="470" width="980" height="150" rx="12" fill="#e0f5f1" stroke="#d0dce6"/>
<text x="80" y="506" font-family="Arial,sans-serif" font-size="25" fill="#17324d">AFTER: pool 192.0.2.100–169 • 70 addresses</text>
<text x="80" y="545" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Add .150–169 only after authoritative ownership approval.</text>
<text x="80" y="584" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Mask /24, relay, gateway and scope options stay unchanged.</text>
<text x="40" y="690" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Rollback must account for live leases issued from the new portion.</text>
<text x="40" y="735" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Proposed lab; no observed lease counts or client allocation claimed.</text>
</svg>
