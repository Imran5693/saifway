<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Python SNMP: preserve distinct outcomes</title><desc id="desc">Proposed single-metric Net-SNMP wrapper and synthetic fixture validation.</desc>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<text x="40" y="50" font-family="Arial,sans-serif" font-size="27" fill="#17324d">Python → bounded snmpget → approved agent</text>
<rect x="60" y="110" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">Collector</text>
<text x="73" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">No secrets in argv</text>
<rect x="630" y="110" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="643" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">Agent 192.0.2.50</text>
<text x="643" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">One numeric Counter64 OID</text>
<path d="M470,160 L630,160" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="300" width="980" height="95" rx="12" fill="#e0f5f1" stroke="#d0dce6"/>
<text x="80" y="334" font-family="Arial,sans-serif" font-size="24" fill="#17324d">VALUE</text>
<text x="80" y="370" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Integer zero is valid data.</text>
<rect x="60" y="415" width="980" height="95" rx="12" fill="#fff3df" stroke="#d0dce6"/>
<text x="80" y="449" font-family="Arial,sans-serif" font-size="24" fill="#17324d">MISSING OBJECT / INSTANCE</text>
<text x="80" y="485" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Protocol response; value is None.</text>
<rect x="60" y="530" width="980" height="95" rx="12" fill="#fff3df" stroke="#d0dce6"/>
<text x="80" y="564" font-family="Arial,sans-serif" font-size="24" fill="#17324d">NO RESPONSE / COLLECTOR FAILURE</text>
<text x="80" y="600" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Keep transport and local deadline separate.</text>
<text x="40" y="735" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Synthetic fixtures verify reporting only; no live availability or metric is claimed.</text>
</svg>
