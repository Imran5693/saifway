<title id="title">Port Security Troubleshooting</title>
<desc id="desc">Investigate the access path before changing the policy. Identify the port and endpoint: Confirm the topology, addressing and expected legitimate client.. Observe MAC learning: Check the source addresses actually presented on the port.. Inspect the violation: Review secure addresses, violation count and port state.. Retest intended access: Validate the allowed endpoint and the denied test case.</desc>
