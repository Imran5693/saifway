<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Validate TLS before reporting expiry</title><desc id="desc">Use an approved hostname list: Define service owners, ports and authorized monitoring scope.. Connect with TLS verification: Use SNI, trusted roots and bounded socket operations.. Evaluate certificate expiry: Calculate remaining time from the verified leaf certificate.. Report failures separately: Distinguish expiry warnings, TLS errors and unavailable data.. Conceptual workflow, not measured lab results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5eead4"/></marker></defs><rect width="1100" height="760" rx="26" fill="#101c30"/><g font-family="Arial, Helvetica, sans-serif"><text x="54" y="53" fill="#5eead4" font-size="19" letter-spacing="2">SAIF WAY TECHNOLOGY · DIAGNOSTIC WORKFLOW</text><text x="54" y="105" fill="white" font-size="34" font-weight="700">Validate TLS before reporting expiry</text><rect x="54" y="142" width="992" height="110" rx="17" fill="#1d3049" stroke="#365472"/><circle cx="94" cy="178" r="20" fill="#5eead4"/><text x="94" y="185" text-anchor="middle" fill="#101c30" font-size="21" font-weight="700">1</text><text x="130" y="186" fill="white" font-size="27" font-weight="700">Use an approved hostname list</text><text x="80" y="222" fill="#cbd5e1" font-size="22">Define service owners, ports and authorized monitoring scope.</text><path d="M550 254V270" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="54" y="275" width="992" height="110" rx="17" fill="#1d3049" stroke="#365472"/><circle cx="94" cy="311" r="20" fill="#5eead4"/><text x="94" y="318" text-anchor="middle" fill="#101c30" font-size="21" font-weight="700">2</text><text x="130" y="319" fill="white" font-size="27" font-weight="700">Connect with TLS verification</text><text x="80" y="355" fill="#cbd5e1" font-size="22">Use SNI, trusted roots and bounded socket operations.</text><path d="M550 387V403" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="54" y="408" width="992" height="110" rx="17" fill="#1d3049" stroke="#365472"/><circle cx="94" cy="444" r="20" fill="#5eead4"/><text x="94" y="451" text-anchor="middle" fill="#101c30" font-size="21" font-weight="700">3</text><text x="130" y="452" fill="white" font-size="27" font-weight="700">Evaluate certificate expiry</text><text x="80" y="488" fill="#cbd5e1" font-size="22">Calculate remaining time from the verified leaf certificate.</text><path d="M550 520V536" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="54" y="541" width="992" height="110" rx="17" fill="#1d3049" stroke="#365472"/><circle cx="94" cy="577" r="20" fill="#5eead4"/><text x="94" y="584" text-anchor="middle" fill="#101c30" font-size="21" font-weight="700">4</text><text x="130" y="585" fill="white" font-size="27" font-weight="700">Report failures separately</text><text x="80" y="621" fill="#cbd5e1" font-size="22">Distinguish expiry warnings, TLS errors and unavailable data.</text><text x="54" y="714" fill="#fbbf24" font-size="21">Proposed diagnostic sequence · validate against your platform and software release.</text></g></svg>