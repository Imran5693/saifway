<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><title>LACP diagnostic decision flow</title><rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<text x="40" y="48" font-family="Arial,sans-serif" font-size="25" fill="#17324d">LACP DECISION FLOW · READ-ONLY EVIDENCE FIRST</text>
<rect x="60" y="95" width="460" height="95" rx="18" fill="#17324d"/><rect x="590" y="95" width="460" height="95" rx="12" fill="white" stroke="#bf6a0c"/><path d="M520,143 H590" stroke="#bf6a0c" stroke-width="4"/>
<text x="80" y="150" font-family="Arial,sans-serif" font-size="25" fill="white">Both physical members up?</text>
<text x="610" y="129" font-family="Arial,sans-serif" font-size="21" fill="#9d5607">No →</text>
<text x="610" y="154" font-family="Arial,sans-serif" font-size="21" fill="#17324d">inspect admin state,</text>
<text x="610" y="179" font-family="Arial,sans-serif" font-size="21" fill="#17324d">cable and optics</text>
<path d="M290,190 V250" stroke="#168c87" stroke-width="4"/>
<text x="310" y="230" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Yes ↓</text>
<rect x="60" y="270" width="460" height="95" rx="18" fill="#17324d"/><rect x="590" y="270" width="460" height="95" rx="12" fill="white" stroke="#bf6a0c"/><path d="M520,318 H590" stroke="#bf6a0c" stroke-width="4"/>
<text x="80" y="325" font-family="Arial,sans-serif" font-size="25" fill="white">Current LACP peer visible?</text>
<text x="610" y="304" font-family="Arial,sans-serif" font-size="21" fill="#9d5607">No →</text>
<text x="610" y="329" font-family="Arial,sans-serif" font-size="21" fill="#17324d">compare cabling,</text>
<text x="610" y="354" font-family="Arial,sans-serif" font-size="21" fill="#17324d">modes and protocol</text>
<path d="M290,365 V425" stroke="#168c87" stroke-width="4"/>
<text x="310" y="405" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Yes ↓</text>
<rect x="60" y="445" width="460" height="95" rx="18" fill="#17324d"/><rect x="590" y="445" width="460" height="95" rx="12" fill="white" stroke="#bf6a0c"/><path d="M520,493 H590" stroke="#bf6a0c" stroke-width="4"/>
<text x="80" y="500" font-family="Arial,sans-serif" font-size="25" fill="white">Both members bundled (P)?</text>
<text x="610" y="479" font-family="Arial,sans-serif" font-size="21" fill="#9d5607">No →</text>
<text x="610" y="504" font-family="Arial,sans-serif" font-size="21" fill="#17324d">inspect compatibility,</text>
<text x="610" y="529" font-family="Arial,sans-serif" font-size="21" fill="#17324d">partner and logs</text>
<path d="M290,540 V600" stroke="#168c87" stroke-width="4"/>
<text x="310" y="580" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Yes ↓</text>
<rect x="60" y="620" width="990" height="80" rx="14" fill="#e0f5f1"/>
<text x="80" y="668" font-family="Arial,sans-serif" font-size="24" fill="#17324d">Verify logical trunk, STP role, intended VLANs and affected service.</text>
<text x="40" y="738" font-family="Arial,sans-serif" font-size="20" fill="#17324d">A passive/passive correction applies only after both configurations confirm that fault.</text>
</svg>
