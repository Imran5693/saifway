<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Destination NAT and security selector before and after correction</title><desc id="desc">Hypothetical PAN-OS lab. DNAT maps published 192.0.2.100 to 198.51.100.10. Security uses original addresses and destination zone dmz. Only the security destination member changes.</desc>
