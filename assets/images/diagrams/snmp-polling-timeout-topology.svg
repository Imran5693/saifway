<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">SNMP poller source access before and after a narrow ACL permit</title><desc id="desc">Hypothetical SNMPv3 authPriv poller .50 queries agent .10 on UDP161. Source ACL permits old poller .40 then denies all. Sequence15 adds .50 before deny20; user and read view stay fixed.</desc>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<text x="40" y="44" font-family="Arial,sans-serif" font-size="20" fill="#17324d">SAIF WAY TECH · HYPOTHETICAL SNMPv3 POLLING LAB</text>
<rect x="25" y="80" width="1050" height="295" rx="12" fill="white" stroke="#d0dce6"/>
<text x="45" y="117" font-family="Arial,sans-serif" font-size="27" fill="#17324d">BEFORE · new collector excluded by source ACL</text>
<rect x="60" y="145" width="300" height="125" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="175" font-family="Arial,sans-serif" font-size="21" fill="white">New poller · Net-SNMP</text>
<text x="73" y="204" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.50/24</text>
<text x="73" y="233" font-family="Arial,sans-serif" font-size="21" fill="white">Protected authPriv profile</text>
<rect x="740" y="145" width="300" height="125" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="753" y="175" font-family="Arial,sans-serif" font-size="21" fill="white">IOS XE switch · Vlan10</text>
<text x="753" y="204" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.10/24</text>
<text x="753" y="233" font-family="Arial,sans-serif" font-size="21" fill="white">NMSV3 · view NMSREAD</text>
<path d="M360,190 L740,190" stroke="#bf6a0c" stroke-width="4"/>
<path d="M542.0,178.0 L558.0,202.0 M558.0,178.0 L542.0,202.0" stroke="#bf6a0c" stroke-width="4"/>
<text x="435" y="171" font-family="Arial,sans-serif" font-size="21" fill="#17324d">GET → UDP 161</text>
<text x="415" y="265" font-family="Arial,sans-serif" font-size="20" fill="#bf6a0c">No usable response</text>
<text x="45" y="309" font-family="Arial,sans-serif" font-size="22" fill="#17324d">SNMP-POLLERS: 10 permit .40 → 20 deny any</text>
<text x="45" y="347" font-family="Arial,sans-serif" font-size="21" fill="#17324d">Same VLAN 10; no NAT. Agent source filter excludes the observed new poller.</text>
<rect x="25" y="395" width="1050" height="295" rx="12" fill="white" stroke="#d0dce6"/>
<text x="45" y="432" font-family="Arial,sans-serif" font-size="27" fill="#17324d">AFTER · permit approved collector before explicit deny</text>
<rect x="60" y="460" width="300" height="125" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="490" font-family="Arial,sans-serif" font-size="21" fill="white">New poller · Net-SNMP</text>
<text x="73" y="519" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.50/24</text>
<text x="73" y="548" font-family="Arial,sans-serif" font-size="21" fill="white">Protected authPriv profile</text>
<rect x="740" y="460" width="300" height="125" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="753" y="490" font-family="Arial,sans-serif" font-size="21" fill="white">IOS XE switch · Vlan10</text>
<text x="753" y="519" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.10/24</text>
<text x="753" y="548" font-family="Arial,sans-serif" font-size="21" fill="white">NMSV3 · view NMSREAD</text>
<path d="M360,505 L740,505" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<text x="435" y="486" font-family="Arial,sans-serif" font-size="21" fill="#17324d">GET → UDP 161</text>
<path d="M740,558 L360,558" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<text x="415" y="580" font-family="Arial,sans-serif" font-size="20" fill="#168c87">← Expected usable reply</text>
<text x="45" y="624" font-family="Arial,sans-serif" font-size="22" fill="#17324d">SNMP-POLLERS: 10 permit .40 → 15 permit .50 → 20 deny any</text>
<text x="45" y="662" font-family="Arial,sans-serif" font-size="21" fill="#17324d">User/security level/view unchanged; verify small GET and actual collection job.</text>
<text x="40" y="738" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Test OID: sysUpTime.0 = 1.3.6.1.2.1.1.3.0. Polling UDP 161 is distinct from traps.</text>
</svg>
