<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">OSPF IP MTU mismatch before and after correction</title><desc id="desc">Hypothetical area 0 point-to-point lab. R2 IP MTU changes from 1400 to 1500; both link MTUs stay 1500.</desc>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<text x="40" y="44" font-family="Arial,sans-serif" font-size="20" fill="#17324d">SAIF WAY TECH · HYPOTHETICAL OSPF LAB</text>
<rect x="25" y="80" width="1050" height="295" rx="12" fill="white" stroke="#d0dce6"/>
<text x="45" y="118" font-family="Arial,sans-serif" font-size="27" fill="#17324d">BEFORE · IP MTUs differ</text>
<rect x="60" y="150" width="300" height="120" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="76" y="183" font-family="Arial,sans-serif" font-size="22" fill="white">R1 · Gi1</text>
<text x="76" y="216" font-family="Arial,sans-serif" font-size="22" fill="white">192.0.2.1/30</text>
<text x="76" y="249" font-family="Arial,sans-serif" font-size="22" fill="white">IP MTU 1500 · link 1500</text>
<rect x="740" y="150" width="300" height="120" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="756" y="183" font-family="Arial,sans-serif" font-size="22" fill="white">R2 · Gi1</text>
<text x="756" y="216" font-family="Arial,sans-serif" font-size="22" fill="white">192.0.2.2/30</text>
<text x="756" y="249" font-family="Arial,sans-serif" font-size="22" fill="white">IP MTU 1400 · link 1500</text>
<path d="M360,210 L740,210" stroke="#bf6a0c" stroke-width="4"/>
<path d="M542.0,198.0 L558.0,222.0 M558.0,198.0 L542.0,222.0" stroke="#bf6a0c" stroke-width="4"/>
<text x="400" y="175" font-family="Arial,sans-serif" font-size="21" fill="#17324d">Area 0 · point-to-point</text>
<text x="400" y="250" font-family="Arial,sans-serif" font-size="22" fill="#17324d">192.0.2.0/30</text>
<text x="45" y="306" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Loopback0: R1 198.51.100.1/32 · R2 203.0.113.2/32 · both advertised</text>
<text x="45" y="346" font-family="Arial,sans-serif" font-size="22" fill="#17324d">EXSTART/EXCHANGE: inspect DBD MTU; small ICMP success is insufficient.</text>
<rect x="25" y="395" width="1050" height="295" rx="12" fill="white" stroke="#d0dce6"/>
<text x="45" y="433" font-family="Arial,sans-serif" font-size="27" fill="#17324d">AFTER · R2 IP MTU aligned to the verified design</text>
<rect x="60" y="465" width="300" height="120" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="76" y="498" font-family="Arial,sans-serif" font-size="22" fill="white">R1 · Gi1</text>
<text x="76" y="531" font-family="Arial,sans-serif" font-size="22" fill="white">192.0.2.1/30</text>
<text x="76" y="564" font-family="Arial,sans-serif" font-size="22" fill="white">IP MTU 1500 · link 1500</text>
<rect x="740" y="465" width="300" height="120" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="756" y="498" font-family="Arial,sans-serif" font-size="22" fill="white">R2 · Gi1</text>
<text x="756" y="531" font-family="Arial,sans-serif" font-size="22" fill="white">192.0.2.2/30</text>
<text x="756" y="564" font-family="Arial,sans-serif" font-size="22" fill="white">IP MTU 1500 · link 1500</text>
<path d="M360,525 L740,525" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<text x="400" y="490" font-family="Arial,sans-serif" font-size="21" fill="#17324d">Area 0 · point-to-point</text>
<text x="400" y="565" font-family="Arial,sans-serif" font-size="22" fill="#17324d">192.0.2.0/30</text>
<text x="45" y="621" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Loopback0: R1 198.51.100.1/32 · R2 203.0.113.2/32 · both advertised</text>
<text x="45" y="661" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Verify stable FULL, remote loopback routes and bidirectional service traffic.</text>
<text x="40" y="744" font-family="Arial,sans-serif" font-size="20" fill="#17324d">No tunnel in this lab. A real encapsulated path requires its own MTU budget.</text>
</svg>
