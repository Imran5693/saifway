<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">IKEv2 SAML: authentication before tunnel proof</title><desc id="desc">Hypothetical pilot profile SAML port mismatch with separate UDP tunnel transport.</desc>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<text x="40" y="50" font-family="Arial,sans-serif" font-size="25" fill="#17324d">vpn.example.test • 203.0.113.10 • standard UDP IKE</text>
<rect x="60" y="110" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">Pilot FortiClient</text>
<text x="73" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">BEFORE: SAML TCP 9444</text>
<rect x="630" y="110" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="643" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">FortiGate SAML listener</text>
<text x="643" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">Approved TCP 9443</text>
<path d="M470,160 L630,160" stroke="#bf6a0c" stroke-width="4"/>
<path d="M542.0,148.0 L558.0,172.0 M558.0,148.0 L542.0,172.0" stroke="#bf6a0c" stroke-width="4"/>
<text x="60" y="265" font-family="Arial,sans-serif" font-size="24" fill="#17324d">AFTER: pilot profile SAML Port 9443; gateway unchanged</text>
<rect x="60" y="330" width="290" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="360" font-family="Arial,sans-serif" font-size="21" fill="white">SAML endpoint</text>
<text x="73" y="389" font-family="Arial,sans-serif" font-size="21" fill="white">TCP 9443</text>
<rect x="405" y="330" width="290" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="418" y="360" font-family="Arial,sans-serif" font-size="21" fill="white">IdP / SP validation</text>
<text x="418" y="389" font-family="Arial,sans-serif" font-size="21" fill="white">Identity and group</text>
<rect x="750" y="330" width="290" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="763" y="360" font-family="Arial,sans-serif" font-size="21" fill="white">IKEv2 / child SA</text>
<text x="763" y="389" font-family="Arial,sans-serif" font-size="21" fill="white">Then test data</text>
<path d="M350,380 L405,380" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M695,380 L750,380" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="500" width="980" height="145" rx="12" fill="#e0f5f1" stroke="#d0dce6"/>
<text x="80" y="537" font-family="Arial,sans-serif" font-size="22" fill="#17324d">IdP example: idp.example.test • browser-based authentication</text>
<text x="80" y="577" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Separate tunnel path: UDP 500/4500 in this lab design</text>
<text x="80" y="615" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Stage boxes are evidence boundaries, not a complete packet trace.</text>
<text x="40" y="735" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Proposed embedded-browser workflow; check exact patch compatibility first.</text>
</svg>
