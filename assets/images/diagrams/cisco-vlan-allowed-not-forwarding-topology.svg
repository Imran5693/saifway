<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Allowed VLAN missing from local database before and after restoration</title><desc id="desc">Hypothetical VLAN42 path from HostA192.0.2.10 to HostB192.0.2.20. Both trunks allow42 but SW-B local VLAN42 is missing. Restoring only the VLAN makes the path eligible for forwarding after STP verification.</desc>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<text x="40" y="44" font-family="Arial,sans-serif" font-size="20" fill="#17324d">SAIF WAY TECH · HYPOTHETICAL VLAN 42 FORWARDING LAB</text>
<rect x="25" y="80" width="1050" height="295" rx="12" fill="white" stroke="#d0dce6"/>
<text x="45" y="116" font-family="Arial,sans-serif" font-size="26" fill="#17324d">BEFORE · allowed on trunk, absent from SW-B database</text>
<rect x="40" y="155" width="225" height="110" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="53" y="185" font-family="Arial,sans-serif" font-size="20" fill="white">Host A</text>
<text x="53" y="214" font-family="Arial,sans-serif" font-size="20" fill="white">192.0.2.10/24</text>
<text x="53" y="243" font-family="Arial,sans-serif" font-size="20" fill="white">Access VLAN 42</text>
<path d="M265,210 L300,210" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="305" y="155" width="225" height="110" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="318" y="185" font-family="Arial,sans-serif" font-size="20" fill="white">SW-A</text>
<text x="318" y="214" font-family="Arial,sans-serif" font-size="20" fill="white">VLAN 42 active</text>
<text x="318" y="243" font-family="Arial,sans-serif" font-size="20" fill="white">Gi1/0/48 trunk</text>
<path d="M530,210 L565,210" stroke="#bf6a0c" stroke-width="4"/>
<path d="M539.5,198.0 L555.5,222.0 M555.5,198.0 L539.5,222.0" stroke="#bf6a0c" stroke-width="4"/>
<rect x="570" y="155" width="225" height="110" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="583" y="185" font-family="Arial,sans-serif" font-size="20" fill="white">SW-B</text>
<text x="583" y="214" font-family="Arial,sans-serif" font-size="20" fill="white">VLAN 42 MISSING</text>
<text x="583" y="243" font-family="Arial,sans-serif" font-size="20" fill="white">Gi1/0/48 trunk</text>
<path d="M795,210 L830,210" stroke="#bf6a0c" stroke-width="4"/>
<path d="M804.5,198.0 L820.5,222.0 M820.5,198.0 L804.5,222.0" stroke="#bf6a0c" stroke-width="4"/>
<rect x="835" y="155" width="225" height="110" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="848" y="185" font-family="Arial,sans-serif" font-size="20" fill="white">Host B</text>
<text x="848" y="214" font-family="Arial,sans-serif" font-size="20" fill="white">192.0.2.20/24</text>
<text x="848" y="243" font-family="Arial,sans-serif" font-size="20" fill="white">Access port inactive</text>
<text x="45" y="309" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Allowed 42: A yes / B yes. Active 42: A yes / B NO.</text>
<text x="45" y="349" font-family="Arial,sans-serif" font-size="21" fill="#17324d">SW-B cannot forward absent VLAN 42; access intent and allowed list remain.</text>
<rect x="25" y="395" width="1050" height="295" rx="12" fill="white" stroke="#d0dce6"/>
<text x="45" y="431" font-family="Arial,sans-serif" font-size="26" fill="#17324d">AFTER · restore only SW-B locally owned VLAN 42</text>
<rect x="40" y="470" width="225" height="110" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="53" y="500" font-family="Arial,sans-serif" font-size="20" fill="white">Host A</text>
<text x="53" y="529" font-family="Arial,sans-serif" font-size="20" fill="white">192.0.2.10/24</text>
<text x="53" y="558" font-family="Arial,sans-serif" font-size="20" fill="white">Access VLAN 42</text>
<path d="M265,525 L300,525" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="305" y="470" width="225" height="110" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="318" y="500" font-family="Arial,sans-serif" font-size="20" fill="white">SW-A</text>
<text x="318" y="529" font-family="Arial,sans-serif" font-size="20" fill="white">VLAN 42 active</text>
<text x="318" y="558" font-family="Arial,sans-serif" font-size="20" fill="white">Gi1/0/48 trunk</text>
<path d="M530,525 L565,525" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="570" y="470" width="225" height="110" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="583" y="500" font-family="Arial,sans-serif" font-size="20" fill="white">SW-B</text>
<text x="583" y="529" font-family="Arial,sans-serif" font-size="20" fill="white">VLAN 42 active</text>
<text x="583" y="558" font-family="Arial,sans-serif" font-size="20" fill="white">Gi1/0/48 trunk</text>
<path d="M795,525 L830,525" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="835" y="470" width="225" height="110" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="848" y="500" font-family="Arial,sans-serif" font-size="20" fill="white">Host B</text>
<text x="848" y="529" font-family="Arial,sans-serif" font-size="20" fill="white">192.0.2.20/24</text>
<text x="848" y="558" font-family="Arial,sans-serif" font-size="20" fill="white">Access VLAN 42</text>
<text x="45" y="624" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Allowed 42: A yes / B yes. Active 42: A yes / B yes.</text>
<text x="45" y="664" font-family="Arial,sans-serif" font-size="21" fill="#17324d">Verify forwarding/not-pruned, MAC paths and host traffic; no gateway needed.</text>
<text x="40" y="738" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Native 99 agrees; access ports Gi1/0/10; VTP transparent; trunk list stays 20,42,99.</text>
</svg>
