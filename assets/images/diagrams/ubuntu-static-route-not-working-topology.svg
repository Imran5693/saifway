<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Ubuntu route: preserve the default gateway</title><desc id="desc">Hypothetical missing /24 route sends target traffic toward the default gateway.</desc>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<text x="40" y="50" font-family="Arial,sans-serif" font-size="26" fill="#17324d">ens18 • 192.0.2.10/24 → target 198.51.100.20</text>
<rect x="60" y="120" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="150" font-family="Arial,sans-serif" font-size="21" fill="white">Ubuntu Server</text>
<text x="73" y="179" font-family="Arial,sans-serif" font-size="21" fill="white">Netplan → networkd</text>
<rect x="630" y="120" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="643" y="150" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.1</text>
<text x="643" y="179" font-family="Arial,sans-serif" font-size="21" fill="white">Default gateway</text>
<path d="M470,170 L630,170" stroke="#bf6a0c" stroke-width="4"/>
<path d="M542.0,158.0 L558.0,182.0 M558.0,158.0 L542.0,182.0" stroke="#bf6a0c" stroke-width="4"/>
<text x="60" y="275" font-family="Arial,sans-serif" font-size="23" fill="#17324d">BEFORE: missing /24 → default gateway .1, wrong target path</text>
<rect x="60" y="350" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="380" font-family="Arial,sans-serif" font-size="21" fill="white">Ubuntu Server</text>
<text x="73" y="409" font-family="Arial,sans-serif" font-size="21" fill="white">Add target-specific /24</text>
<rect x="630" y="350" width="410" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="643" y="380" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.254</text>
<text x="643" y="409" font-family="Arial,sans-serif" font-size="21" fill="white">Approved onward router</text>
<path d="M470,400 L630,400" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<text x="60" y="505" font-family="Arial,sans-serif" font-size="24" fill="#17324d">AFTER: 198.51.100.0/24 via 192.0.2.254, metric 100</text>
<rect x="60" y="555" width="980" height="95" rx="12" fill="#e0f5f1" stroke="#d0dce6"/>
<text x="80" y="590" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Default via .1 stays unchanged for unrelated destinations.</text>
<text x="80" y="625" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Verify source-specific lookup, neighbor delivery and return route.</text>
<text x="40" y="735" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Proposed single-table lab. Policy rules can change which table is consulted.</text>
</svg>
