<text x="643" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.3/24 • priority 100</text>
<text x="643" y="198" font-family="Arial,sans-serif" font-size="21" fill="white">Active</text>
<path d="M470,175 L630,175" stroke="#bf6a0c" stroke-width="4"/>
<path d="M542.0,163.0 L558.0,187.0 M558.0,163.0 L542.0,187.0" stroke="#bf6a0c" stroke-width="4"/>
<text x="60" y="273" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Gi1/0/48 ↔ Gi1/0/48 • native 99 agrees</text>
<text x="60" y="311" font-family="Arial,sans-serif" font-size="22" fill="#17324d">SW-B allows 99 only; VLAN 42 hellos cannot cross</text>
<text x="40" y="405" font-family="Arial,sans-serif" font-size="24" fill="#17324d">AFTER — peer hellos delivered</text>
