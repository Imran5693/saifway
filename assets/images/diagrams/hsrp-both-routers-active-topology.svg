<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">HSRP group 42: restore the peer path</title><desc id="desc">Hypothetical HSRPv2 dual-active example and intended post-repair election.</desc>
