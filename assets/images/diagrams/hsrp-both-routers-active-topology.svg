<text x="73" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">SW-A • Vlan42</text>
<text x="73" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.2/24 • priority 110</text>
<text x="73" y="198" font-family="Arial,sans-serif" font-size="21" fill="white">Active</text>
<rect x="630" y="110" width="410" height="125" rx="12" fill="#17324d" stroke="#17324d"/>
