<text x="73" y="450" font-family="Arial,sans-serif" font-size="21" fill="white">SW-A • Vlan42</text>
<text x="73" y="479" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.2/24 • priority 110</text>
<text x="73" y="508" font-family="Arial,sans-serif" font-size="21" fill="white">Active</text>
<rect x="630" y="420" width="410" height="125" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="643" y="450" font-family="Arial,sans-serif" font-size="21" fill="white">SW-B • Vlan42</text>
<text x="643" y="479" font-family="Arial,sans-serif" font-size="21" fill="white">192.0.2.3/24 • priority 100</text>
<text x="643" y="508" font-family="Arial,sans-serif" font-size="21" fill="white">Standby</text>
<path d="M470,485 L630,485" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<text x="60" y="583" font-family="Arial,sans-serif" font-size="23" fill="#17324d">Gi1/0/48 ↔ Gi1/0/48 • native 99 agrees</text>
<text x="60" y="621" font-family="Arial,sans-serif" font-size="22" fill="#17324d">SW-B adds tagged 42; 224.0.0.102 UDP 1985 crosses</text>
<text x="40" y="730" font-family="Arial,sans-serif" font-size="20" fill="#17324d">Both SVIs stay up through local access ports. Proposed lab; no captured state.</text>
