<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">BGP transport: small packets can hide a limit</title><desc id="desc">Hypothetical 1400-byte inner IPv4 path and blocked PMTUD feedback.</desc>
<rect width="1100" height="760" rx="18" fill="#f3f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#168c87"/></marker></defs>
<text x="40" y="50" font-family="Arial,sans-serif" font-size="27" fill="#17324d">BGP peers: 192.0.2.1/32 ↔ 192.0.2.2/32</text>
<rect x="60" y="110" width="290" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="73" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">Peer A • Loopback0</text>
<text x="73" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">Router-originated TCP</text>
<rect x="405" y="110" width="290" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="418" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">Routed tunnel path</text>
<text x="418" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">Inner IPv4 MTU 1400</text>
<rect x="750" y="110" width="290" height="100" rx="12" fill="#17324d" stroke="#17324d"/>
<text x="763" y="140" font-family="Arial,sans-serif" font-size="21" fill="white">Peer B • Loopback0</text>
<text x="763" y="169" font-family="Arial,sans-serif" font-size="21" fill="white">BGP over TCP</text>
<path d="M350,160 L405,160" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M695,160 L750,160" stroke="#168c87" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="310" width="980" height="125" rx="12" fill="#fff3df" stroke="#d0dce6"/>
<text x="80" y="350" font-family="Arial,sans-serif" font-size="24" fill="#17324d">BEFORE: small packets pass; larger DF packets stall</text>
<text x="80" y="392" font-family="Arial,sans-serif" font-size="23" fill="#17324d">ICMP type 3/code 4 feedback is generated but blocked.</text>
<rect x="60" y="500" width="980" height="130" rx="12" fill="#e0f5f1" stroke="#d0dce6"/>
<text x="80" y="538" font-family="Arial,sans-serif" font-size="23" fill="#17324d">AFTER: required feedback reaches sender; TCP can adapt</text>
<text x="80" y="580" font-family="Arial,sans-serif" font-size="22" fill="#17324d">Path limit stays 1400; a 1500-byte DF echo may still fail correctly.</text>
<text x="40" y="735" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Proposed path example; update size alone does not establish an MTU diagnosis.</text>
</svg>
