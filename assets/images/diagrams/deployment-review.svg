<title id="title">Infrastructure Deployment Review</title>
<desc id="desc">Prepare a service that can be operated and investigated. Requirements and ownership: Record the required flows, approver and responsible operator.. Identity and trust boundaries: Review privilege, management access and certificate lifecycle.. Operational evidence: Check logs, timestamps, monitoring and denied actions.. Recovery and handover: Exercise recovery and assign open exceptions to an owner.</desc>
