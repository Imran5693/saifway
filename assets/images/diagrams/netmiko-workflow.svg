<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="960" viewBox="0 0 1100 960" role="img" aria-labelledby="title desc">
<title id="title">Multi-Vendor Python Automation</title>
<desc id="desc">A conceptual view of the inventory-to-verification workflow. Prepare inventory and scope: Classify device platforms; check targets and authorized access. Connect and identify the session: Use the correct Netmiko handler; check prompts and privileges. Execute the approved workflow: Handle vendor commands, timing and failures per device. Verify and report results: Check resulting state; preserve logs and investigate failed devices.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#5eead4"/></marker></defs>
<rect width="1100" height="960" rx="26" fill="#101c30"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="54" y="60" fill="#5eead4" font-size="19" letter-spacing="2">SAIF WAY TECHNOLOGY · IMRAN SARWAR</text>
<text x="54" y="119" fill="#ffffff" font-size="37" font-weight="700">Multi-Vendor Python Automation</text>
<text x="54" y="163" fill="#cbd5e1" font-size="23">A conceptual view of the inventory-to-verification workflow.</text>
<rect x="54" y="205" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="248" r="22" fill="#5eead4"/>
<text x="100" y="256" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">1</text>
<text x="143" y="251" fill="#ffffff" font-size="27" font-weight="700">Prepare inventory and scope</text>
<text x="143" y="293" fill="#d9e5f2" font-size="22">Classify device platforms; check targets and authorized access.</text>
<path d="M550 337 V361" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="54" y="369" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="412" r="22" fill="#5eead4"/>
<text x="100" y="420" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">2</text>
<text x="143" y="415" fill="#ffffff" font-size="27" font-weight="700">Connect and identify the session</text>
<text x="143" y="457" fill="#d9e5f2" font-size="22">Use the correct Netmiko handler; check prompts and privileges.</text>
<path d="M550 501 V525" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="54" y="533" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="576" r="22" fill="#5eead4"/>
<text x="100" y="584" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">3</text>
<text x="143" y="579" fill="#ffffff" font-size="27" font-weight="700">Execute the approved workflow</text>
<text x="143" y="621" fill="#d9e5f2" font-size="22">Handle vendor commands, timing and failures per device.</text>
<path d="M550 665 V689" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="54" y="697" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="740" r="22" fill="#5eead4"/>
<text x="100" y="748" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">4</text>
<text x="143" y="743" fill="#ffffff" font-size="27" font-weight="700">Verify and report results</text>
<text x="143" y="785" fill="#d9e5f2" font-size="22">Check resulting state; preserve logs and investigate failed devices.</text>
<text x="54" y="913" fill="#a8bdcf" font-size="21">Illustration of the documented approach, not a measured deployment result.</text>
</g></svg>