<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="960" viewBox="0 0 1100 960" role="img" aria-labelledby="title desc">
<title id="title">Investigate the Symptom, Find the Cause</title>
<desc id="desc">Network symptoms can originate outside the network. Define the impact: Which users, services and locations are affected? Since when? Check network evidence: Inspect connectivity, interfaces, paths and relevant recent changes. Correlate service dependencies: Compare endpoint, DNS, authentication and application evidence. Validate the cause and recovery: Test the explanation; verify the service after an approved fix.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#5eead4"/></marker></defs>
<rect width="1100" height="960" rx="26" fill="#101c30"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="54" y="60" fill="#5eead4" font-size="19" letter-spacing="2">SAIF WAY TECHNOLOGY · IMRAN SARWAR</text>
<text x="54" y="119" fill="#ffffff" font-size="37" font-weight="700">Investigate the Symptom, Find the Cause</text>
<text x="54" y="163" fill="#cbd5e1" font-size="23">Network symptoms can originate outside the network.</text>
<rect x="54" y="205" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="248" r="22" fill="#5eead4"/>
<text x="100" y="256" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">1</text>
<text x="143" y="251" fill="#ffffff" font-size="27" font-weight="700">Define the impact</text>
<text x="143" y="293" fill="#d9e5f2" font-size="22">Which users, services and locations are affected? Since when?</text>
<path d="M550 337 V361" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="54" y="369" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="412" r="22" fill="#5eead4"/>
<text x="100" y="420" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">2</text>
<text x="143" y="415" fill="#ffffff" font-size="27" font-weight="700">Check network evidence</text>
<text x="143" y="457" fill="#d9e5f2" font-size="22">Inspect connectivity, interfaces, paths and relevant recent changes.</text>
<path d="M550 501 V525" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="54" y="533" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="576" r="22" fill="#5eead4"/>
<text x="100" y="584" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">3</text>
<text x="143" y="579" fill="#ffffff" font-size="27" font-weight="700">Correlate service dependencies</text>
<text x="143" y="621" fill="#d9e5f2" font-size="22">Compare endpoint, DNS, authentication and application evidence.</text>
<path d="M550 665 V689" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="54" y="697" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="740" r="22" fill="#5eead4"/>
<text x="100" y="748" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">4</text>
<text x="143" y="743" fill="#ffffff" font-size="27" font-weight="700">Validate the cause and recovery</text>
<text x="143" y="785" fill="#d9e5f2" font-size="22">Test the explanation; verify the service after an approved fix.</text>
<text x="54" y="913" fill="#a8bdcf" font-size="21">Conceptual diagnostic workflow. The evidence determines the next step.</text>
</g></svg>