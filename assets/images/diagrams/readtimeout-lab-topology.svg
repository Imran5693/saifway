<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Proposed GNS3 or EVE-NG Netmiko lab</title>
<desc id="desc">A Python Linux VM at 192.0.2.10 connects through a management switch to a Cisco virtual router at 192.0.2.20 using SSH on TCP port 22. Console access and session logs provide separate diagnostic evidence. This is a proposed topology, not a tested lab capture.</desc>
