<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="960" viewBox="0 0 1100 960" role="img" aria-labelledby="title desc">
<title id="title">Choosing a Network Automation Interface</title>
<desc id="desc">Compare the access method before designing the workflow. Netmiko · SSH / CLI: Python → device session → vendor commands → text results NETCONF · structured RPCs: XML operations → supported models, datastores and capabilities RESTCONF · HTTPS / YANG data: HTTP methods → modeled resources → JSON or XML results Vendor REST API · product-specific: Application → documented endpoints → platform-specific responses</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#5eead4"/></marker></defs>
<rect width="1100" height="960" rx="26" fill="#101c30"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="54" y="60" fill="#5eead4" font-size="19" letter-spacing="2">SAIF WAY TECHNOLOGY · IMRAN SARWAR</text>
<text x="54" y="119" fill="#ffffff" font-size="37" font-weight="700">Choosing a Network Automation Interface</text>
<text x="54" y="163" fill="#cbd5e1" font-size="23">Compare the access method before designing the workflow.</text>
<rect x="54" y="205" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="248" r="22" fill="#5eead4"/>
<text x="100" y="256" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">1</text>
<text x="143" y="251" fill="#ffffff" font-size="27" font-weight="700">Netmiko · SSH / CLI</text>
<text x="143" y="293" fill="#d9e5f2" font-size="22">Python → device session → vendor commands → text results</text>

<rect x="54" y="369" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="412" r="22" fill="#5eead4"/>
<text x="100" y="420" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">2</text>
<text x="143" y="415" fill="#ffffff" font-size="27" font-weight="700">NETCONF · structured RPCs</text>
<text x="143" y="457" fill="#d9e5f2" font-size="22">XML operations → supported models, datastores and capabilities</text>

<rect x="54" y="533" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="576" r="22" fill="#5eead4"/>
<text x="100" y="584" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">3</text>
<text x="143" y="579" fill="#ffffff" font-size="27" font-weight="700">RESTCONF · HTTPS / YANG data</text>
<text x="143" y="621" fill="#d9e5f2" font-size="22">HTTP methods → modeled resources → JSON or XML results</text>

<rect x="54" y="697" width="992" height="126" rx="18" fill="#1d3049" stroke="#365472"/>
<circle cx="100" cy="740" r="22" fill="#5eead4"/>
<text x="100" y="748" text-anchor="middle" fill="#101c30" font-size="23" font-weight="700">4</text>
<text x="143" y="743" fill="#ffffff" font-size="27" font-weight="700">Vendor REST API · product-specific</text>
<text x="143" y="785" fill="#d9e5f2" font-size="22">Application → documented endpoints → platform-specific responses</text>
<text x="54" y="913" fill="#a8bdcf" font-size="21">Conceptual comparison. Device support and capabilities must be verified.</text>
