faq:
- question: Where can I get final year project guidance in Pakistan?
  answer: Contact Saif Way Tech for independent online technical guidance. Share your brief, university, tools and current progress so Imran Sarwar
    can assess whether the topic fits his experience and availability.
- question: Do you support Virtual University final year projects?
  answer: Yes, VU students can discuss CS619 requirements, project scope, setup, debugging, documentation structure and viva preparation. Bring
    your current brief and supervisor feedback. Saif Way Tech is independent of Virtual University.
- question: Can you help me understand and implement my CS or IT project?
  answer: Support can include architecture reviews, implementation mentoring and troubleshooting specific blockers. You remain responsible for
    developing, understanding and submitting your own assessed work.
- question: Do you provide Cisco Packet Tracer and GNS3 lab guidance?
  answer: Share your topology, addressing plan, required protocols and sanitized configurations. Guidance can cover routing, VLANs, NAT, ACLs
    and verification, with simulator or image limitations discussed first.
- question: Can you help configure Ubuntu or Linux for my project?
  answer: Requests can cover installation, virtual machines, networking, SSH, Python environments, Docker and web server setup. Include your OS
    version, environment and the exact error.
- question: Can you troubleshoot Python and Flask applications?
  answer: Share a minimal reproducible example, package versions, expected behavior and sanitized error output. Sessions can focus on application
    logic, APIs, databases, environments and deployment problems.
- question: Do you provide AI and machine learning project guidance?
  answer: Discuss dataset preparation, preprocessing, classification, evaluation, AI dashboards or local LLM integration. Feasibility depends
    on your dataset access, hardware and university requirements; model accuracy is not guaranteed.
- question: Can you help with UML diagrams and software architecture?
  answer: Bring your requirements and draft diagrams for a review of actors, use cases, module boundaries, data flows and database relationships.
    Guidance helps you explain and refine your own design.
- question: Can I get help preparing for my demonstration or viva?
  answer: Review your setup, test cases, results and design decisions, then practise explaining them. Support does not include impersonation,
    attending an assessment for you or guaranteed academic results.
- question: How can I share my project requirements?
  answer: Use a WhatsApp button to open a prepared message, fill in your university, degree program, project title, domain, support needed and
    deadline, then review and send it yourself. Do not send passwords, access tokens or private datasets.
